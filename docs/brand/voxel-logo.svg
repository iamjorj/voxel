  <g stroke="#7C6CF6" stroke-width="9" stroke-linecap="round">
    <line x1="30" y1="38" x2="30" y2="62"/>
    <line x1="45" y1="30" x2="45" y2="82"/>
    <line x1="60" y1="46" x2="60" y2="98"/>
    <line x1="75" y1="30" x2="75" y2="82"/>
    <line x1="90" y1="38" x2="90" y2="62"/>
  </g>
</svg>
