# Runs the audio engine on GitHub's Apple Silicon Macs and keeps the converted audio to listen to.
name: Mac engine test

on:
  push:
    branches: [mac-engine-test]
  workflow_dispatch:

jobs:
  engine:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run the engine test
        run: dotnet run --project VoiceChanger.EngineTest -c Release -- "$GITHUB_WORKSPACE/results"
      - name: Show the results on the run page
        if: always()
        run: |
          if [ -f results/results.txt ]; then
            { echo '```'; cat results/results.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-engine-results
          path: results/
