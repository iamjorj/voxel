# Builds the Mac app on GitHub's Mac, draws every screen, and opens the real window to photograph it.
name: Mac app test

on:
  push:
    branches: [mac-engine-test]
    paths:
      - Voxel.Mac/**
      - Voxel.Mac.Screens/**
      - VoiceChanger.Mac/**
      - .github/workflows/mac-app-test.yml
  workflow_dispatch:

jobs:
  app:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install VB-CABLE with Voxel's own script
        run: sudo sh VoiceChanger.Mac/install-vbcable.sh Voxel.Mac/Assets/vbcable/VBCable_MACDriver_Pack108.zip
      - name: Draw every screen
        run: dotnet run --project Voxel.Mac.Screens -c Release -- "$GITHUB_WORKSPACE/results/screens"
      - name: Open the real app and photograph it
        run: |
          dotnet build Voxel.Mac -c Release -nologo -v q
          dotnet Voxel.Mac/bin/Release/net10.0/Voxel.dll > results/app-log.txt 2>&1 &
          app=$!
          sleep 12
          if kill -0 $app; then echo "app is running"; else echo "app exited early"; cat results/app-log.txt; exit 1; fi
          screencapture -x results/real-window.png || echo "screen capture not allowed here"
          kill $app || true
          cat results/app-log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-app-results
          path: results/
