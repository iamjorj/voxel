# Runs Voxel's Mac audio path on real Core Audio devices: VB-CABLE as shipped, BlackHole as a stand-in
# microphone (GitHub's Macs have none; BlackHole is used by this test only and is never shipped).
name: Mac live audio test

on:
  push:
    branches: [main, mac-engine-test]
    paths:
      - VoiceChanger.Mac/**
      - VoiceChanger.Mac.LiveTest/**
      - VoiceChanger.Core/Dsp/**
      - .github/workflows/mac-live-test.yml
  workflow_dispatch:

jobs:
  live:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install VB-CABLE with Voxel's own script
        run: sudo sh VoiceChanger.Mac/install-vbcable.sh Voxel.Mac/Assets/vbcable/VBCable_MACDriver_Pack108.zip
      - name: Install BlackHole (stand-in mic)
        run: brew install --cask blackhole-2ch
      - name: Restart Core Audio
        run: |
          sudo killall coreaudiod || true
          sleep 5
          system_profiler SPAudioDataType
      - name: Run the live test
        run: |
          # A separate little program that only notices when it fails to wake up on time. If it
          # freezes while Voxel does, the whole machine stopped, not Voxel.
          mkdir -p results
          cat > monitor.py <<'PY'
          import time
          last = time.monotonic()
          while True:
              time.sleep(0.01)
              now = time.monotonic()
              if now - last > 0.2:
                  print(time.strftime("%H:%M:%S", time.gmtime()), "machine stalled for", int((now - last) * 1000), "ms", flush=True)
              last = now
          PY
          python3 -u monitor.py > results/stalls.txt &
          monitor=$!
          code=0
          dotnet run --project VoiceChanger.Mac.LiveTest -c Release -- "$GITHUB_WORKSPACE/results" || code=$?
          kill $monitor || true
          echo "--- stalls seen by the separate program:"
          cat results/stalls.txt
          exit $code
      - name: Show the results on the run page
        if: always()
        run: |
          if [ -f results/results.txt ]; then
            { echo '```'; cat results/results.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-live-results
          path: results/
